<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Les cygnes</title>
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; margin: 0 auto; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import { boot } from "/studio/engine.js";

const photo = new Image();
const loaded = new Promise((resolve, reject) => {
  photo.onload = () => resolve();
  photo.onerror = () => reject(new Error("missing source.png"));
  photo.src = "/films/cygnes/source.png";
  if (photo.complete && photo.naturalWidth) resolve();
});

const plate = document.createElement("canvas");
const plateCtx = plate.getContext("2d", { alpha: false });

boot({
  title: "Les cygnes",
  purpose: "cinematic",
  look: "glossy-ad",
  fps: 24,
  width: 960,
  height: 960,
  duration: 8,
  music: null,
  sound: [
    { t: 0, kind: "pad", note: "C3", dur: 8, gain: 0.18 },
    { t: 0, kind: "pad", note: "G3", dur: 8, gain: 0.1 },
    { t: 0, kind: "pad", note: "E4", dur: 8, gain: 0.06 },
    { t: 0, kind: "water", dur: 8, gain: 0.09 },
    { t: 0.4, kind: "pluck", note: "E4", gain: 0.14 },
    { t: 2.0, kind: "pluck", note: "G4", gain: 0.13 },
    { t: 3.6, kind: "pluck", note: "C5", gain: 0.12 },
    { t: 5.2, kind: "pluck", note: "G4", gain: 0.11 },
    { t: 6.8, kind: "pluck", note: "E4", gain: 0.1 },
  ],
  voice: [],
  draw(ctx, t, api) {
    const horizon = Math.round(api.h * 0.36);
    paintPlate(api, t);
    ctx.drawImage(plate, 0, 0);
    ripple(ctx, api, horizon, t);
    sparkles(ctx, t, api, horizon);
    hearts(ctx, t, api);
  },
});

window.STUDIO_READY = Promise.resolve(window.STUDIO_READY).then(async (meta) => {
  await loaded;
  return meta;
});

function paintPlate(api, t) {
  const zoom = api.lerp(1, 1.4, api.clamp(t / 7.2, 0, 1));
  const scale = Math.max(api.w / photo.width, api.h / photo.height) * zoom;
  const width = photo.width * scale;
  const height = photo.height * scale;
  const focusX = photo.width * 0.49;
  const focusY = photo.height * 0.69;
  let x = api.w * 0.5 - focusX * scale;
  let y = api.h * 0.56 - focusY * scale;
  x = Math.min(0, Math.max(api.w - width, x));
  y = Math.min(0, Math.max(api.h - height, y));
  if (plate.width !== api.w || plate.height !== api.h) {
    plate.width = api.w;
    plate.height = api.h;
  }
  plateCtx.drawImage(photo, x, y, width, height);
}

function ripple(ctx, api, horizon, t) {
  const strip = 3;
  for (let y = horizon; y < api.h; y += strip) {
    const depth = (y - horizon) / (api.h - horizon);
    const shift = Math.sin(y * 0.045 + t * 2.15) * depth * 12;
    const h = Math.min(strip, api.h - y);
    ctx.drawImage(plate, 0, y, api.w, h, shift, y, api.w, h);
  }
}

function sparkles(ctx, t, api, horizon) {
  const rand = api.rng(5);
  for (let i = 0; i < 36; i += 1) {
    const x = rand() * api.w;
    const y = horizon + rand() * (api.h - horizon);
    const twinkle = Math.max(0, Math.sin(t * 3.2 + i * 1.6));
    const alpha = twinkle ** 3;
    if (alpha < 0.04) continue;
    const radius = 1.2 + (i % 4);
    ctx.save();
    ctx.globalAlpha = alpha * 0.85;
    ctx.fillStyle = "#fffaf2";
    ctx.beginPath();
    ctx.arc(x, y, radius * 0.45, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(x - radius * 2, y - 0.5, radius * 4, 1);
    ctx.fillRect(x - 0.5, y - radius * 2, 1, radius * 4);
    ctx.restore();
  }
}

function hearts(ctx, t, api) {
  const rand = api.rng(2);
  for (let i = 0; i < 8; i += 1) {
    const x0 = rand() * api.w;
    const speed = 22 + rand() * 30;
    const size = 8 + rand() * 14;
    const phase = rand();
    const travel = (t * speed + phase * (api.h + 80)) % (api.h + 80);
    const y = api.h + 20 - travel;
    const x = x0 + Math.sin(t * 0.7 + i) * 14;
    const life = Math.sin(api.clamp(travel / (api.h + 80), 0, 1) * Math.PI);
    ctx.save();
    ctx.globalAlpha = life * 0.34;
    ctx.fillStyle = i % 2 === 0 ? "#ffe4f0" : "#fffafc";
    heart(ctx, x, y, size);
    ctx.restore();
  }
}

function heart(ctx, x, y, size) {
  ctx.beginPath();
  ctx.moveTo(x, y + size * 0.35);
  ctx.bezierCurveTo(x, y, x - size, y, x - size, y + size * 0.4);
  ctx.bezierCurveTo(x - size, y + size * 0.85, x, y + size, x, y + size * 1.2);
  ctx.bezierCurveTo(x, y + size, x + size, y + size * 0.85, x + size, y + size * 0.4);
  ctx.bezierCurveTo(x + size, y, x, y, x, y + size * 0.35);
  ctx.fill();
}
</script>
</body>
</html>
